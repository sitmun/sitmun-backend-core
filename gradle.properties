# Configure daemon (tight hosts: keep Xms low so the JVM can start under memory pressure)
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx384m -Xms64m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/heapdump.hprof

# Parallel execution
org.gradle.parallel=false
org.gradle.caching=true

# One test JVM — parallel forks multiply heap and OOM local pre-commit hooks
org.gradle.test.maxParallelForks=1

# Additional performance optimizations
org.gradle.configureondemand=true
org.gradle.workers.max=1