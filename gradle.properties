# Configure daemon
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2g -Xms256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/heapdump.hprof

# Parallel execution
org.gradle.parallel=true
org.gradle.caching=true

# One test JVM — parallel forks multiply heap on tight hosts
org.gradle.test.maxParallelForks=1

# Additional performance optimizations
org.gradle.configureondemand=true
org.gradle.workers.max=2
