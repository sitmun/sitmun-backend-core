databaseChangeLog:
  # Collapsed greenfield seed (replaces 17_mia_no_data_literal + 18_mia_chrome_literals + 19_mia_chrome_english_keys).
  # Keys are English; LTR_LANID = en (1). Values: ca=3, es=2, en=1, fr=5.

  - changeSet:
      id: 17-seed-mia-chrome-no-data
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
          and:
            - tableExists:
                tableName: STM_LITERAL_TRANSLATION
            - tableExists:
                tableName: STM_LITERAL_TRANSLATION_VALUE
            - sqlCheck:
                expectedResult: 0
                sql: SELECT COUNT(*) FROM STM_LITERAL_TRANSLATION WHERE LTR_LITERAL = 'No data'
      changes:
        - sql: |
            INSERT INTO STM_LITERAL_TRANSLATION (LTR_ID, LTR_LITERAL, LTR_LANID)
            SELECT COALESCE((SELECT MAX(LTR_ID) FROM STM_LITERAL_TRANSLATION), 0) + 1,
                   'No data',
                   1
            FROM STM_LANGUAGE
            WHERE LAN_ID = 1
        - sql: |
            INSERT INTO STM_LITERAL_TRANSLATION_VALUE (LTV_ID, LTV_LTRID, LTV_LANID, LTV_VALUE)
            SELECT COALESCE((SELECT MAX(LTV_ID) FROM STM_LITERAL_TRANSLATION_VALUE), 0) + 1,
                   t.LTR_ID, 3, 'Sense dades'
            FROM STM_LITERAL_TRANSLATION t WHERE t.LTR_LITERAL = 'No data'
        - sql: |
            INSERT INTO STM_LITERAL_TRANSLATION_VALUE (LTV_ID, LTV_LTRID, LTV_LANID, LTV_VALUE)
            SELECT COALESCE((SELECT MAX(LTV_ID) FROM STM_LITERAL_TRANSLATION_VALUE), 0) + 1,
                   t.LTR_ID, 2, 'Sin datos'
            FROM STM_LITERAL_TRANSLATION t WHERE t.LTR_LITERAL = 'No data'
        - sql: |
            INSERT INTO STM_LITERAL_TRANSLATION_VALUE (LTV_ID, LTV_LTRID, LTV_LANID, LTV_VALUE)
            SELECT COALESCE((SELECT MAX(LTV_ID) FROM STM_LITERAL_TRANSLATION_VALUE), 0) + 1,
                   t.LTR_ID, 1, 'No data'
            FROM STM_LITERAL_TRANSLATION t WHERE t.LTR_LITERAL = 'No data'
        - sql: |
            INSERT INTO STM_LITERAL_TRANSLATION_VALUE (LTV_ID, LTV_LTRID, LTV_LANID, LTV_VALUE)
            SELECT COALESCE((SELECT MAX(LTV_ID) FROM STM_LITERAL_TRANSLATION_VALUE), 0) + 1,
                   t.LTR_ID, 5, 'Aucune donnee'
            FROM STM_LITERAL_TRANSLATION t WHERE t.LTR_LITERAL = 'No data'
        - sql: |
            UPDATE STM_SEQUENCE
            SET SEQ_COUNT = (SELECT COALESCE(MAX(LTR_ID), 0) + 1 FROM STM_LITERAL_TRANSLATION)
            WHERE SEQ_NAME = 'LTR_ID'
        - sql: |
            UPDATE STM_SEQUENCE
            SET SEQ_COUNT = (SELECT COALESCE(MAX(LTV_ID), 0) + 1 FROM STM_LITERAL_TRANSLATION_VALUE)
            WHERE SEQ_NAME = 'LTV_ID'
