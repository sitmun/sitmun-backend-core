databaseChangeLog:
  - changeSet:
      id: 23-feature-info-field-columns-h2
      author: sitmun
      dbms: h2
      changes:
        - addColumn:
            tableName: STM_PAR_GI
            columns:
              - column:
                  name: PGI_DIGITS
                  type: INTEGER
              - column:
                  name: PGI_PAD
                  type: BOOLEAN
              - column:
                  name: PGI_DATESTYLE
                  type: VARCHAR(20)
  - changeSet:
      id: 23-feature-info-field-columns-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - addColumn:
            tableName: STM_PAR_GI
            columns:
              - column:
                  name: PGI_DIGITS
                  type: INTEGER
              - column:
                  name: PGI_PAD
                  type: BOOLEAN
              - column:
                  name: PGI_DATESTYLE
                  type: VARCHAR(20)
  - changeSet:
      id: 23-feature-info-field-columns-oracle
      author: sitmun
      dbms: oracle
      changes:
        - addColumn:
            tableName: STM_PAR_GI
            columns:
              - column:
                  name: PGI_DIGITS
                  type: NUMBER(10)
              - column:
                  name: PGI_PAD
                  type: NUMBER(1)
              - column:
                  name: PGI_DATESTYLE
                  type: VARCHAR2(20 CHAR)
  - changeSet:
      id: 23-feature-info-auto-h2
      author: sitmun
      dbms: h2
      changes:
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'cartographyParameter.format', 'AUTO', FALSE, FALSE, 'Automatic'
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'cartographyParameter.format' AND COD_VALUE = 'AUTO'
              );
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST)
              WHERE SEQ_NAME = 'COD_ID';
  - changeSet:
      id: 23-feature-info-auto-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'cartographyParameter.format', 'AUTO', FALSE, FALSE, 'Automatic'
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'cartographyParameter.format' AND COD_VALUE = 'AUTO'
              );
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST)
              WHERE SEQ_NAME = 'COD_ID';
  - changeSet:
      id: 23-feature-info-auto-oracle
      author: sitmun
      dbms: oracle
      changes:
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'cartographyParameter.format', 'AUTO', 0, 0, 'Automatic'
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'cartographyParameter.format' AND COD_VALUE = 'AUTO'
              );
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST)
              WHERE SEQ_NAME = 'COD_ID';
