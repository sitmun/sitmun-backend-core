databaseChangeLog:
  - changeSet:
      id: 27-parameter-operation-scope-codes-h2
      author: sitmun
      dbms: h2
      changes:
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'serviceParameter.type', 'GETMAP', FALSE, FALSE, 'GetMap'
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'serviceParameter.type' AND COD_VALUE = 'GETMAP'
              );
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'serviceParameter.type', 'WFS', FALSE, FALSE, 'All WFS operations'
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'serviceParameter.type' AND COD_VALUE = 'WFS'
              );
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'cartographyServiceParameter.type', 'GETMAP', FALSE, FALSE, 'GetMap'
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'cartographyServiceParameter.type' AND COD_VALUE = 'GETMAP'
              );
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'cartographyServiceParameter.type', 'INFO', FALSE, FALSE, 'GetFeatureInfo'
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'cartographyServiceParameter.type' AND COD_VALUE = 'INFO'
              );
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST)
              WHERE SEQ_NAME = 'COD_ID';

