databaseChangeLog:
  - changeSet:
      id: 28-parameter-type-translations
      author: sitmun
      changes:
        - sql:
            sql: |
              UPDATE STM_TRANSLATION
              SET TRA_NAME = 'Todas las operaciones WMS'
              WHERE TRA_LANID = 2
                AND TRA_COLUMN IN ('description', 'CodeListValue.description')
                AND TRA_ELEID IN (
                  SELECT COD_ID FROM STM_CODELIST
                  WHERE COD_VALUE = 'WMS'
                    AND COD_LIST IN ('serviceParameter.type', 'cartographyServiceParameter.type')
                )
        - sql:
            sql: |
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 2, 'Todas las operaciones WMS'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'WMS'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID
                    AND t.TRA_LANID = 2
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                )
