databaseChangeLog:
  # Align backend-core nullability with JPA-required / production-stricter columns.
  # Selective NOT NULL: JPA validated_not_null + @NotNull associations.
  # Idempotent via sqlCheck (column currently nullable). No JDBC metadata preconditions.
  # FK nulls: DELETE orphans. bool/varchar/double: backfill then addNotNullConstraint.

  # ── h2 ─────────────────────────────────────────────────────────────
  - changeSet:
      id: 22-nn-app-bckg-abc-appid-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT CASE WHEN IS_NULLABLE = 'YES' THEN 1 ELSE 0 END
              FROM INFORMATION_SCHEMA.COLUMNS
              WHERE UPPER(TABLE_NAME) = 'STM_APP_BCKG'
              AND UPPER(COLUMN_NAME) = 'ABC_APPID'
      changes:
        - sql:
            sql: DELETE FROM STM_APP_BCKG WHERE ABC_APPID IS NULL
        - addNotNullConstraint:
            tableName: STM_APP_BCKG
            columnName: ABC_APPID
            columnDataType: INTEGER

