databaseChangeLog:
  - changeSet:
      id: 25-service-check-h2
      author: sitmun
      dbms: h2
      changes:
        - sql:
            sql: |
              CREATE TABLE STM_SERVICE_CHECK (
                SEC_ID INTEGER NOT NULL,
                SEC_SERID INTEGER NOT NULL,
                SEC_OBSERVER VARCHAR(16) NOT NULL,
                SEC_STATUS VARCHAR(50) NOT NULL,
                SEC_RANK INTEGER NOT NULL,
                SEC_OBSERVED TIMESTAMP NOT NULL,
                SEC_ELAPSED BIGINT NOT NULL,
                SEC_DETAIL VARCHAR(4000) NOT NULL,
                CONSTRAINT STM_SEC_PK PRIMARY KEY (SEC_ID),
                CONSTRAINT STM_SEC_UK UNIQUE (SEC_SERID, SEC_OBSERVER),
                CONSTRAINT STM_SEC_FK_SER FOREIGN KEY (SEC_SERID) REFERENCES STM_SERVICE (SER_ID) ON DELETE CASCADE
              )
        - sql:
            sql: |
              CREATE TABLE STM_SERVICE_CHECK_SAMPLE (
                SCS_ID INTEGER NOT NULL,
                SCS_SERID INTEGER NOT NULL,
                SCS_OBSERVER VARCHAR(16) NOT NULL,
                SCS_STATUS VARCHAR(50) NOT NULL,
                SCS_RANK INTEGER NOT NULL,
                SCS_ELAPSED BIGINT NOT NULL,
                SCS_OBSERVED TIMESTAMP NOT NULL,
                CONSTRAINT STM_SCS_PK PRIMARY KEY (SCS_ID),
                CONSTRAINT STM_SCS_FK_SER FOREIGN KEY (SCS_SERID) REFERENCES STM_SERVICE (SER_ID) ON DELETE CASCADE
              )
        - sql:
            sql: CREATE INDEX STM_SCS_IX_SER_OBS ON STM_SERVICE_CHECK_SAMPLE (SCS_SERID, SCS_OBSERVED)

