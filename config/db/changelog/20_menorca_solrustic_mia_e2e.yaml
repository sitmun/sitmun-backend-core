      author: sitmun
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM STM_APP WHERE APP_ID = 12 AND (APP_GGIID IS NULL OR APP_GGIID <> 3)
      changes:
        - update:
            tableName: STM_APP
            columns:
              - column: { name: APP_GGIID, valueNumeric: 3 }
            where: APP_ID = 12

