      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM STM_TERRITORY WHERE TER_ID = 4
      changes:
        - insert:
            tableName: STM_TERRITORY
            columns:
              - column: { name: TER_ID, valueNumeric: 4 }
              - column: { name: TER_CODTER, value: "07000" }
              - column: { name: TER_NAME, value: Menorca }
              - column: { name: TER_ADMNAME, value: Menorca }
              - column: { name: TER_SCOPE, value: T }
              - column: { name: TER_EXTENT, value: "568000 4405000 610000 4435000" }
              - column: { name: TER_BLOCKED, valueBoolean: false }
              - column: { name: TER_TYPID, valueNumeric: 8 }
              - column: { name: TER_CENTER, value: "589000 4420000" }
              - column: { name: TER_ZOOM, valueNumeric: 10 }
              - column: { name: TER_PROJECT, value: "EPSG:25831" }

