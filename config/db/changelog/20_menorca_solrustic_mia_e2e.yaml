  # Direct (non-proxied) WMS → Playwright stub. Avoids middleware /proxy/12/4/... for this leaf.
  - changeSet:
      id: 20_menorca_solrustic_direct_wms
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM STM_SERVICE WHERE SER_ID = 9030
      changes:
        - insert:
            tableName: STM_SERVICE
            columns:
              - column: { name: SER_ID, valueNumeric: 9030 }
              - column: { name: SER_NAME, value: "E2E direct WMS tu007rts_ccavalls" }
              - column: { name: SER_URL, value: "http://127.0.0.1:18093/wms" }
              - column: { name: SER_PROTOCOL, value: WMS }
              - column: { name: SER_BLOCKED, valueBoolean: false }
              - column: { name: SER_PROXIED, valueBoolean: false }

  - changeSet:
      id: 20_menorca_solrustic_cartography
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM STM_GEOINFO WHERE GEO_ID = 1304
      changes:
        - insert:
            tableName: STM_GEOINFO
            columns:
              - column: { name: GEO_ID, valueNumeric: 1304 }
              - column: { name: GEO_NAME, value: "Trams camí de cavalls" }
              - column: { name: GEO_LAYERS, value: tu007rts_ccavalls }
              - column: { name: GEO_ORDER, valueNumeric: 0 }
              - column: { name: GEO_QUERYABL, valueBoolean: true }
              - column: { name: GEO_QUERYACT, valueBoolean: true }
              - column: { name: GEO_QUERYLAY, value: tu007rts_ccavalls }
              - column: { name: GEO_SERID, valueNumeric: 9030 }
              - column: { name: GEO_THEMATIC, valueBoolean: false }
              - column: { name: GEO_BLOCKED, valueBoolean: false }
              - column: { name: GEO_FILTER_GFI, valueBoolean: false }
              - column: { name: GEO_FILTER_SS, valueBoolean: false }
              - column: { name: GEO_STYUSEALL, valueBoolean: false }
        - insert:
            tableName: STM_AVAIL_GI
            columns:
              - column: { name: AGI_ID, valueNumeric: 1304 }
              - column: { name: AGI_TERID, valueNumeric: 4 }
              - column: { name: AGI_GIID, valueNumeric: 1304 }
        # GGI 1 + role 1: Menorca (ter 4) only — do not AVAIL on ter 1 or app 1/1
        # FeatureInfo will GFI this layer and break mia-gfi-click (expects 34_TOPO_TX).
        - insert:
            tableName: STM_GGI_GI
            columns:
              - column: { name: GGG_GGIID, valueNumeric: 1 }
              - column: { name: GGG_GIID, valueNumeric: 1304 }

