        - sql:
            sql: |
              DELETE FROM STM_LITERAL_TRANSLATION
              WHERE EXISTS (
                SELECT 1
                FROM STM_LITERAL_TRANSLATION k
                WHERE k.LTR_LITERAL = STM_LITERAL_TRANSLATION.LTR_LITERAL
