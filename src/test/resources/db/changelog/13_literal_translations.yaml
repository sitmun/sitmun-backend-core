databaseChangeLog:
  - changeSet:
      id: 10-create-literal-translation
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: STM_LITERAL_TRANSLATION
      changes:
        - createTable:
            tableName: STM_LITERAL_TRANSLATION
            columns:
              - column:
                  name: LTR_ID
                  type: int
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: LTR_LITERAL
                  type: clob
                  constraints:
                    nullable: false

  - changeSet:
      id: 10-create-literal-translation-value
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: STM_LITERAL_TRANSLATION_VALUE
      changes:
        - createTable:
            tableName: STM_LITERAL_TRANSLATION_VALUE
            columns:
              - column:
                  name: LTV_ID
                  type: int
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: LTV_LTRID
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: LTV_LANID
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: LTV_VALUE
                  type: clob
                  constraints:
                    nullable: false

  - changeSet:
      id: 10-add-literal-translation-value-uk
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
          not:
            uniqueConstraintExists:
              tableName: STM_LITERAL_TRANSLATION_VALUE
              constraintName: STM_LTV_UK
      changes:
        - addUniqueConstraint:
            tableName: STM_LITERAL_TRANSLATION_VALUE
            columnNames: LTV_LTRID, LTV_LANID
            constraintName: STM_LTV_UK

  - changeSet:
      id: 10-add-literal-translation-value-literal-fk
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
          not:
            foreignKeyConstraintExists:
              foreignKeyName: STM_LTV_FK_LTR
      changes:
        - addForeignKeyConstraint:
            baseTableName: STM_LITERAL_TRANSLATION_VALUE
            baseColumnNames: LTV_LTRID
            constraintName: STM_LTV_FK_LTR
            referencedTableName: STM_LITERAL_TRANSLATION
            referencedColumnNames: LTR_ID
            onDelete: CASCADE

  - changeSet:
      id: 10-add-literal-translation-value-language-fk
      author: sitmun
      preConditions:
        - onFail: MARK_RAN
          not:
            foreignKeyConstraintExists:
              foreignKeyName: STM_LTV_FK_LAN
      changes:
        - addForeignKeyConstraint:
            baseTableName: STM_LITERAL_TRANSLATION_VALUE
            baseColumnNames: LTV_LANID
            constraintName: STM_LTV_FK_LAN
            referencedTableName: STM_LANGUAGE
            referencedColumnNames: LAN_ID
