databaseChangeLog:
  - changeSet:
      id: 2
      author: sitmun
      changes:
        - loadData:
            encoding: UTF-8
            file: 02_codelists/STM_CODELIST.csv
            relativeToChangelogFile: true
            tableName: STM_CODELIST
            columns:
              - column:
                  name: COD_ID
                  type: NUMERIC
              - column:
                  name: COD_LIST
                  type: STRING
              - column:
                  name: COD_VALUE
                  type: STRING
              - column:
                  name: COD_SYSTEM
                  type: BOOLEAN
              - column:
                  name: COD_DEFAULT
                  type: BOOLEAN
              - column:
                  name: COD_DESCRIPTION
                  type: STRING
        # Liquibase reads a plain "null" value as SQL NULL.
        - insert:
            tableName: STM_CODELIST
            columns:
              - column: { name: COD_ID, valueNumeric: 114 }
              - column: { name: COD_LIST, value: taskEntity.jsonParamType }
              - column: { name: COD_VALUE, valueComputed: "'null'" }
              - column: { name: COD_SYSTEM, valueBoolean: true }
              - column: { name: COD_DEFAULT, valueBoolean: false }
              - column: { name: COD_DESCRIPTION, valueComputed: "'null'" }
        - sql:
            sql: INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('COD_ID', 116);
